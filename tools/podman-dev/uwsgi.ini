[uwsgi]
strict = true
; dual-stack bind: [::] accepts IPv4 too (bindv6only=0), and host `localhost`
; resolves to ::1 first, which pasta forwards to the container's v6 side
http = [::]:8012
module = postgresqleu.wsgi:application
; settings.py, docsviews and STATICFILES_DIRS use CWD-relative paths
chdir = /app
master = true
processes = 2
threads = 3
py-autoreload = 1
die-on-term = true

; static serving (production pattern; replaces the dev symlink hack)
static-map = /media=/app/media
static-map = /media/pgus=/skin/media/pgus
static-map = /media/admin=/opt/django-admin-static
